[package]
name = "dockshell"
version = "0.1.0"
description = "Native GUI for local and remote Docker hosts"
authors = ["xFarid6"]
license = "FSL-1.1-MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dockshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = { version = "0.19", features = ["ssl"] }
tokio = { version = "1", features = ["macros", "process"] }
futures-util = "0.3"
# Shared profile-store + keyring crate (issue #14); connections.rs is a thin
# adapter over it.
conn-manager = { git = "https://github.com/xFarid6/conn-manager-rs", branch = "main" }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
